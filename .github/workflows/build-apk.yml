name: Build Acode APK

on:
  push:
    branches:
      - main
      - terminal/**
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "lts/*"
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Compute build metadata
        id: meta
        run: |
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=acode-debug-$GIT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm install
          npm install -g cordova
          npm run setup

      - name: Build debug APK
        run: |
          # Build a normal (paid) dev debug APK; no signing keys required for debug.
          npm run build paid dev apk
          APK_PATH="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" "/tmp/${{ steps.meta.outputs.artifact_name }}.apk"
          echo "apk_path=/tmp/${{ steps.meta.outputs.artifact_name }}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: /tmp/${{ steps.meta.outputs.artifact_name }}.apk
          retention-days: 7

      - name: Build summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Commit | ${{ steps.meta.outputs.git_commit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${{ steps.meta.outputs.artifact_name }}.apk |" >> $GITHUB_STEP_SUMMARY
